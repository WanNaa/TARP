data:
  train_batch_size: 64
  micro_batch_size_per_gpu: 1
  train_files: null
  val_files: null
  prompt_key: prompt
  chosen_key: chosen
  rejected_key: rejected
  max_length: 3072
  truncation: left
  use_shm: False
model:
  partial_pretrain: null
  use_shm: False
  fsdp_config:
    model_dtype: bf16
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: True
  trust_remote_code: False
  lora_rank: 0
  lora_alpha: 16
  target_modules: all-linear
  use_liger: False
  strategy: fsdp2
ref_model:
  partial_pretrain: null
dpo:
  beta: 0.1
optim:
  lr: 1e-6
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine
ulysses_sequence_parallel_size: 1
use_remove_padding: False
ewc_export_only: False
use_ewc_loss: False
ewc_mode: DIAG_FISHER
ewc_lambda: 0.0
ewc_root: /path/to/outputs/ewc
ewc_dir: null
ewc_tag: null
ewc_load_path: null
ewc_dataset_key: null
ewc_store_dtype: bf16
ewc_target_steps: 64
ewc_online: False
ewc_online_decay: 1.0
trainer:
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  default_hdfs_dir: null
  resume_path: null
  project_name: kk-dpo
  experiment_name: test
  total_epochs: 1
  total_training_steps: 100
  logger: ['console']
  seed: 1
  save_freq: 50
  test_freq: -1
  nnodes: 1
  n_gpus_per_node: 4
  max_ckpt_to_keep: null
